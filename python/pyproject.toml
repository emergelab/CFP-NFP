[project]
name = "cfpnfp"
version = "0.1.0"
description = "Connectome / nodal fingerprints (NRS + predictive models) - Python implementation of CFP-NFP"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
fmri = ["nibabel>=5.0", "nilearn>=0.10"]      # cfpnfp extract
nfp = ["mat-io>=0.4"]                         # read FPs/AD_NFP.mat (MATLAB tables)
test = ["pytest>=8", "h5py>=3.9"]

[project.scripts]
cfpnfp = "cfpnfp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfpnfp"]
